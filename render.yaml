# Render Blueprint for PACT (one web service, Docker, free plan).
#
# Persistence: the free plan has no persistent disk, so SQLite lives in /tmp and is reset
# whenever the service restarts, redeploys or spins down after inactivity. The catalog and
# seed mandates are recreated on every start. For persistent data use a paid plan with a disk:
#   plan: starter
#   disk: { name: pact-data, mountPath: /var/data, sizeGB: 1 }
#   DATABASE_URL=sqlite:////var/data/pact.db
#
# Secrets are declared with sync: false so Render prompts for them; never commit values.
services:
  - type: web
    name: pact-ai-payment-guardian
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/pact.db
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CURRENCY
        value: USD
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set to the service's public URL, e.g. https://pact-ai-payment-guardian.onrender.com
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      # Owner sign-in for the Control Center. REQUIRE_OWNER_AUTH makes the service fail closed:
      # mandates, approvals, payments and agent management are refused until OWNER_PASSWORD is set.
      - key: REQUIRE_OWNER_AUTH
        value: "true"
      - key: OWNER_PASSWORD
        sync: false
