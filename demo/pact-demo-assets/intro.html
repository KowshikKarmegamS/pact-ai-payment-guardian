<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PACT intro</title>
<link rel="stylesheet" href="card.css" />
<style>
  h1 { font-size: 208px; font-weight: 700; letter-spacing: 0.1em; line-height: 1; margin-top: 54px; padding-left: 0.1em; }
  .eyebrow { margin-top: 30px; font-size: 28px; letter-spacing: 0.3em; padding-left: 0.3em; }
  .rule { width: 0; height: 2px; margin: 58px auto 0; background: linear-gradient(90deg, transparent, #7c8cff, #9a7bff, transparent); animation: widen 1.1s 3.0s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
  .tag { margin-top: 52px; font-size: 50px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; max-width: 1380px; }
  @keyframes widen { to { width: 620px; } }
</style>
</head>
<body data-seconds="10">
  <div class="glow"></div><div class="grid"></div>
  <div class="stage">
    <div class="mark pop" style="animation-delay:.5s">
      <svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <h1 class="in" style="animation-delay:1.3s">PACT</h1>
    <p class="eyebrow in" style="animation-delay:2.0s">The payment authorization gateway for AI agents</p>
    <div class="rule"></div>
    <p class="tag in" style="animation-delay:3.9s">Let any AI agent shop for you,<br /><span class="accent">only within the limits you set.</span></p>
  </div>
</body>
</html>
